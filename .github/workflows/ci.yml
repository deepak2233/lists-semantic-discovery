name: quality
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.13.6
          uv sync --frozen --extra dev
      - name: Static checks
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Tests and authored relevance regression
        run: |
          npm ci
          npm run build
          uv run --no-sync pytest
          npm test
          uv run --no-sync python scripts/evaluate.py --output output/ci-evaluation.json
      - name: Audit locked production dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes --output-file /tmp/lists-production-requirements.txt
          uv run --no-sync pip-audit -r /tmp/lists-production-requirements.txt
          uv run --no-sync pip-audit -r deploy/vercel-requirements.txt

[project]
name = "lists-model-training"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0+cpu",
  "transformers==4.57.6",
  "peft==0.18.0",
  "safetensors==0.6.2",
  "numpy==2.3.4",
  "onnx==1.19.1",
  "onnxruntime==1.31.1",
  "pyarrow==21.0.0",
  "scipy==1.16.3",
  "httpx[socks]==0.28.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
